# Python Notebook Tests (Azure DevOps)
#
# Runs the notebook tests against Azure OpenAI with Entra ID auth (no API key).
# These run in Azure DevOps because GitHub-hosted Actions runners cannot obtain
# Entra ID tokens for the tenant that hosts the Azure OpenAI resource.
#
# Pipeline variables (set in Azure DevOps, not in this file):
#   GRAPHRAG_API_BASE - Azure OpenAI endpoint

trigger:
  branches:
    include:
      - main
      - "*/main" # match branches like feature/main
  paths:
    exclude:
      - "**/*.md"
      - .semversioner

pr:
  autoCancel: true # only run for the latest commit
  drafts: false # skip draft PRs
  branches:
    include:
      - main
      - "*/main"
  paths:
    exclude:
      - "**/*.md"
      - .semversioner

variables:
  pythonVersion: "3.13"

jobs:
  - job: notebook_tests
    displayName: Notebook tests
    strategy:
      matrix:
        ubuntu:
          vmImage: ubuntu-latest
        windows:
          vmImage: windows-latest
    pool:
      vmImage: $(vmImage)
    steps:
      - task: UsePythonVersion@0
        displayName: Set up Python $(pythonVersion)
        inputs:
          versionSpec: $(pythonVersion)

      - script: python -m pip install uv
        displayName: Install uv

      - script: uv sync --all-packages
        displayName: Install dependencies

      # The notebooks use Entra ID auth when GRAPHRAG_API_KEY is unset;
      # DefaultAzureCredential picks up the Azure CLI login made by this task.
      - task: AzureCLI@2
        displayName: Notebook Test
        inputs:
          azureSubscription: graphrag-oss-ci
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: uv run poe test_notebook
        env:
          DEBUG: 1
          GRAPHRAG_API_BASE: $(GRAPHRAG_API_BASE)
